auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  allow_structured_metadata: true
  # Support "all time" queries from the Graphium UI.
  # Loki defaults this to ~30d1h, which makes `start=0` fail with
  # "query time range exceeds the limit".
  max_query_length: 8760h
  max_query_lookback: 8760h
