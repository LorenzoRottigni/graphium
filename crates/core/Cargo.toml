[package]
name = "graphium"
version = "0.1.0"
edition = "2024"

[lib]
name = "graphium"
doctest = true

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
graphium-macro = { version = "0.1.0", path = "../macro", optional = true }
opentelemetry = { version = "0.31.0", optional = true }
opentelemetry_sdk = { version = "0.31.0", optional = true, features = [
    "experimental_async_runtime",
    "rt-tokio-current-thread",
    "experimental_trace_batch_span_processor_with_async_runtime",
    "experimental_logs_batch_log_processor_with_async_runtime",
    "experimental_metrics_periodicreader_with_async_runtime",
] }
opentelemetry-otlp = { version = "0.31.1", optional = true, default-features = false, features = ["http-proto", "reqwest-client", "trace", "metrics", "logs"] }
once_cell = "1.21.4"
tracing = "0.1"
tracing-opentelemetry = { version = "0.32.0", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry"] }
opentelemetry-appender-tracing = { version = "0.31.0", optional = true }

[features]
# Enables DTO serde support (`graphium::serde` re-export + serde derives).
export = ["dep:serde"]
# Enables macro-generated `Graph::dto()` / `Graph::flow()` helpers (no serde).
dto = []
# Enables macro-generated metrics wrappers and helpers.
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:opentelemetry-appender-tracing",
]
metrics = ["telemetry"]
# Enables macro-generated trace spans (OTLP to Tempo by default).
trace = ["telemetry"]
# Enables macro-generated logs export (OTLP to Loki by default).
logs = ["telemetry"]
# Enables macro-generated `GraphPlayground` impls.
playground = []
# Back-compat alias (deprecated): prefer `export`.
serialize = ["export"]
macros = ["dep:graphium-macro"]

[dev-dependencies]
# Used by documentation doctests so examples can `use graphium_macro::{graph, node, ...}`
# without requiring consumers to enable `graphium`'s `macros` feature.
graphium-macro = { version = "0.1.0", path = "../macro" }
