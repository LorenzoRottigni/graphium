[package]
name = "graphium-ui"
version = "0.1.0-alpha.6"
edition = "2024"
description = "Web UI to visualize, test, run, and inspect Graphium graphs."
license = "MIT"
repository = "https://github.com/LorenzoRottigni/graphium"
homepage = "https://github.com/LorenzoRottigni/graphium"
documentation = "https://docs.rs/graphium-ui"
readme = "README.md"

[lib]
doctest = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
graphium = { version = "0.1.0-alpha.6", path = "../core", features = ["export"] }
askama = "0.15.6"
tower-http = { version = "0.6", features = ["fs"] }
